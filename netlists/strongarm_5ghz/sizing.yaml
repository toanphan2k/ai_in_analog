geometry:
  diffusion_length_um: 0.29

optimization:
  variables: [w_in, l_in, w_n, w_p, w_rst, w_tail, w_8, l_8]
  derived_features: [w_over_l, w_times_l]
  bounds:
    w_in: {min: 6.0, max: 40.0, scale: log}
    l_in: {min: 0.15, max: 0.35, scale: log}
    w_n: {min: 0.5, max: 8.0, scale: log}
    w_p: {min: 0.5, max: 8.0, scale: log}
    w_rst: {min: 2.5, max: 25.0, scale: log}
    w_tail: {min: 8.0, max: 60.0, scale: log}
    w_8: {min: 0.5, max: 8.0, scale: log}
    l_8: {min: 0.15, max: 1.0, scale: log}

parameters:
  w_in: {spice_name: W_IN, required: true}
  l_in: {spice_name: L_IN, required: true}
  w_n: {spice_name: W_N, required: true}
  l_n: {spice_name: L_N, default: 0.15}
  w_p: {spice_name: W_P, required: true}
  l_p: {spice_name: L_P, default: 0.15}
  w_tail: {spice_name: W_TAIL, required: true}
  w_8: {spice_name: W_EQ, required: true}
  l_8: {spice_name: L_EQ, required: true}
  w_rst: {spice_name: W_RST, required: true}
  l_rst: {spice_name: L_RST, default: 0.15}

groups:
  input_pair:
    devices: [XM1, XM2]
    width: w_in
    length: l_in
  nmos_latch_pair:
    devices: [XM3, XM4]
    width: w_n
    length: l_n
  pmos_latch_pair:
    devices: [XM5, XM6]
    width: w_p
    length: l_p
  tail_switch:
    devices: [XM7]
    width: w_tail
    length: l_n
  equalizer:
    devices: [XM8]
    width: w_8
    length: l_8
  reset_pair:
    devices: [XMr1, XMr2]
    width: w_rst
    length: l_rst

analyses:
  transient:
    enabled: true
    waveform: "transient.txt"
    vdd_v: 1.8
    period_s: 2.0e-10
    power_window_s: [2.0e-9, 6.4e-9]
    output_positive: "v(X)"
    output_negative: "v(Y)"
    clock_vector: "v(ck)"
    input_positive: "v(inp)"
    input_negative: "v(inn)"
    power_vector: "p_inst"
    reset_threshold_ratio: 0.9
    inverting: true
    check_polarity: true
  gain:
    enabled: true
    waveform: "ac.txt"
    output_positive: "v(X)"
    output_negative: "v(Y)"
    input_positive: "v(inp)"
    input_negative: "v(inn)"
  offset:
    enabled: true
    metrics_file: "metrics.txt"
    key: "input_referred_offset_v"
  noise:
    enabled: true
    waveform: "noise.txt"
    metrics_file: "metrics.txt"
    output_spectrum: "onoise_spectrum"
    input_spectrum: "inoise_spectrum"
  kickback:
    enabled: true
    waveform: "kickback.txt"
    metrics_file: "metrics.txt"
    window_s: [4.0e-10, 1.2e-9]
    differential_vector: "vkb_diff"
